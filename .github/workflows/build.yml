name: Build and Release

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to release (e.g., v0.7.2). Leave empty for dev build only.'
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build frontend
        run: pnpm run build

      - name: Download Decky CLI
        run: |
          mkdir -p cli
          curl -L -o cli/decky "https://github.com/SteamDeckHomebrew/cli/releases/download/0.0.8/decky-linux-x86_64"
          chmod +x cli/decky

      # Python dependencies are not built here. This fork has the same
      # requirements as Decky Translator 0.9.1, so package.json's remote_binary
      # keeps pointing at upstream's public plugin-dependencies.tar.gz (with its
      # SHA256), which Decky Loader downloads when the plugin is installed. If
      # requirements.txt changes, restore the dependency build from upstream's
      # workflow and publish the archive with a release here.

      - name: Get version
        id: version
        run: |
          if [[ -n "${{ inputs.release_version }}" ]]; then
            VERSION="${{ inputs.release_version }}"
            IS_RELEASE="true"
          else
            VERSION="dev-$(echo ${{ github.sha }} | cut -c1-7)"
            IS_RELEASE="false"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Version: $VERSION (is_release: $IS_RELEASE)"

      - name: Set release version in package.json
        if: steps.version.outputs.is_release == 'true'
        run: |
          sed -i -E "0,/\"version\": \"[^\"]+\"/s//\"version\": \"${{ steps.version.outputs.version }}\"/" package.json
          grep '"version"' package.json | head -1
          # remote_binary must still be upstream's dependency archive
          grep -A4 '"remote_binary"' package.json

      - name: Commit and tag release
        if: steps.version.outputs.is_release == 'true'
        run: |
          git config user.name "Jason Hiew"
          git config user.email "jasonhiew.123jh@gmail.com"

          if git diff --quiet package.json; then
            echo "No changes to package.json"
          else
            git add package.json
            git commit -m "chore: set version ${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

          git tag -fa "${{ steps.version.outputs.version }}" -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}" --force

      - name: Build plugin with Decky CLI
        run: |
          cli/decky plugin build $(pwd) -o ./out

      - name: Repack zip with kebab-case inner folder
        run: |
          cd out
          mkdir _staging
          unzip -q "Decky Translator.zip" -d _staging
          # Same folder name as upstream, so it installs over / updates the same plugin
          mv "_staging/Decky Translator" "_staging/decky-translator"
          rm "Decky Translator.zip"
          (cd _staging && zip -qr "../decky-ocr-notify.zip" decky-translator)
          rm -rf _staging
          unzip -l "decky-ocr-notify.zip" | head -5

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: decky-ocr-notify
          path: out/decky-ocr-notify.zip

  release:
    if: needs.build.outputs.is_release == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: decky-ocr-notify
          path: ./

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: decky-ocr-notify.zip
          draft: true
          generate_release_notes: true
